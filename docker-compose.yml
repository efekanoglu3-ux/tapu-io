services:
  postgres:
    image: postgres:16
    container_name: tapu_io_db
    environment:
      POSTGRES_USER: tapu_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tapu_io
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapu_user -d tapu_io"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tapu_io_redis
    ports:
      - "6379:6379"

  # Backend local dev'de npm run dev ile ayrı çalışır
  # Production için: docker compose --profile prod up
  backend:
    build: ./backend
    container_name: tapu_io_backend
    profiles: ["prod"]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://tapu_user:password@postgres:5432/tapu_io
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  postgres_data:
